<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Not found — panoscool</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('pc:theme');
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <main id="main" class="section">
    <p class="eyebrow"><span class="eyebrow__idx">404</span> // not found</p>
    <h1>Page not found</h1>
    <p class="section__sub">This page could not be found. Return to the home page to view the apps.</p>
    <div class="cta">
      <a class="btn btn--primary" href="/"><span>Home</span></a>
    </div>
  </main>
</body>

</html>
