# Static site — nothing to build, the repo root is the site.
[build]
  publish = "."
  # Nothing to compile — this overrides any build command left over in the Netlify UI.
  command = "echo 'static site: no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
